<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>GLITCH AI Assistant</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#020611;
    color:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:100%;
    max-width:600px;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 35%, #102b55 0%, #061329 30%, #020611 70%);
}

/* BACKGROUND */

.grid{
    position:absolute;
    left:0;
    right:0;
    bottom:-10%;
    height:55%;
    opacity:.25;
    background-image:
        linear-gradient(rgba(0,180,255,.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,.25) 1px, transparent 1px);
    background-size:40px 40px;
    transform:perspective(400px) rotateX(60deg);
    transform-origin:bottom;
}

/* TOP */

.top{
    position:absolute;
    top:20px;
    left:0;
    right:0;
    text-align:center;
    z-index:5;
}

.logo{
    font-size:34px;
    font-weight:bold;
    letter-spacing:8px;
    color:#67e8ff;
    text-shadow:
        0 0 10px #00c8ff,
        0 0 25px #008cff;
}

.subtitle{
    margin-top:5px;
    font-size:11px;
    letter-spacing:4px;
    color:#7f9ab8;
}

/* STATUS */

.status{
    position:absolute;
    top:100px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 18px;
    border:1px solid rgba(0,220,255,.35);
    border-radius:30px;
    background:rgba(0,20,40,.55);
    color:#70eaff;
    font-size:12px;
    z-index:5;
}

/* ORB */

.orb-area{
    position:absolute;
    top:145px;
    left:50%;
    transform:translateX(-50%);
    width:280px;
    height:280px;
}

.orb{
    position:absolute;
    left:50%;
    top:50%;
    width:120px;
    height:120px;
    transform:translate(-50%,-50%);
    border-radius:50%;

    background:
        radial-gradient(circle at 35% 30%,
        #dfffff 0%,
        #55eaff 10%,
        #087fff 40%,
        #03255d 70%,
        #01091c 100%);

    box-shadow:
        0 0 20px #00d9ff,
        0 0 50px #008cff,
        0 0 100px rgba(0,170,255,.7);

    animation:pulse 2s infinite;
}

.orb.listening{
    animation:listening .65s infinite alternate;
    box-shadow:
        0 0 30px #00ffcc,
        0 0 70px #00ffcc,
        0 0 120px rgba(0,255,200,.7);
}

@keyframes pulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(1);
    }
    50%{
        transform:translate(-50%,-50%) scale(1.08);
    }
}

@keyframes listening{
    from{
        transform:translate(-50%,-50%) scale(1);
    }
    to{
        transform:translate(-50%,-50%) scale(1.15);
    }
}

.ring{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border:1px solid rgba(0,220,255,.45);
    border-radius:50%;
}

.r1{
    width:155px;
    height:155px;
    animation:spin 8s linear infinite;
}

.r2{
    width:205px;
    height:205px;
    border-style:dashed;
    animation:spinReverse 12s linear infinite;
}

.r3{
    width:255px;
    height:255px;
    border-color:rgba(0,150,255,.2);
    animation:spin 18s linear infinite;
}

@keyframes spin{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
}

@keyframes spinReverse{
    from{transform:translate(-50%,-50%) rotate(360deg);}
    to{transform:translate(-50%,-50%) rotate(0deg);}
}

/* CENTER TEXT */

.center-text{
    position:absolute;
    top:430px;
    left:25px;
    right:25px;
    text-align:center;
    z-index:5;
}

.command{
    min-height:50px;
    font-size:16px;
    color:#d7faff;
    line-height:1.5;
}

.response{
    margin-top:8px;
    min-height:45px;
    font-size:14px;
    color:#71dcff;
    line-height:1.5;
}

/* MIC */

.mic{
    position:absolute;
    left:50%;
    bottom:145px;
    transform:translateX(-50%);
    width:78px;
    height:78px;
    border-radius:50%;
    border:2px solid #32dfff;
    background:rgba(0,120,190,.18);
    color:#72ecff;
    font-size:30px;
    cursor:pointer;

    box-shadow:
        0 0 15px rgba(0,210,255,.5),
        inset 0 0 20px rgba(0,150,255,.15);

    z-index:10;
}

.mic:active{
    transform:translateX(-50%) scale(.92);
}

.mic.active{
    border-color:#00ffcc;
    color:#00ffcc;
    box-shadow:
        0 0 30px #00ffcc,
        0 0 60px rgba(0,255,200,.5);
}

/* QUICK COMMANDS */

.quick{
    position:absolute;
    left:12px;
    right:12px;
    bottom:65px;

    display:flex;
    gap:7px;
    justify-content:center;
    flex-wrap:wrap;

    z-index:5;
}

.quick button{
    border:1px solid rgba(0,210,255,.35);
    background:rgba(0,25,50,.65);
    color:#9befff;
    padding:8px 11px;
    border-radius:20px;
    font-size:11px;
    cursor:pointer;
}

.quick button:active{
    background:rgba(0,150,255,.3);
}

/* FOOTER */

.footer{
    position:absolute;
    bottom:15px;
    left:0;
    right:0;
    text-align:center;
    color:#536b86;
    font-size:9px;
    letter-spacing:2px;
}

/* ACTIVITY */

.activity{
    position:absolute;
    top:105px;
    right:10px;
    width:115px;
    max-height:90px;
    overflow:hidden;
    font-size:8px;
    color:#45657f;
    text-align:right;
    z-index:4;
}

/* DESKTOP */

@media(min-width:700px){

    .app{
        height:95vh;
        border:1px solid rgba(0,190,255,.2);
        border-radius:20px;
        box-shadow:0 0 50px rgba(0,120,255,.2);
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="grid"></div>

    <div class="top">
        <div class="logo">GLITCH</div>
        <div class="subtitle">AI PERSONAL ASSISTANT</div>
    </div>

    <div id="status" class="status">
        SYSTEM READY
    </div>

    <div id="activity" class="activity"></div>

    <div class="orb-area">

        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>

        <div id="orb" class="orb"></div>

    </div>

    <div class="center-text">

        <div id="command" class="command">
            नमस्ते। मैं GLITCH हूँ।
        </div>

        <div id="response" class="response">
            मुझसे हिंदी में बात कीजिए।
        </div>

    </div>

    <button id="mic" class="mic">
        🎙️
    </button>

    <div class="quick">

        <button onclick="quickCommand('समय क्या हुआ है')">
            🕐 समय
        </button>

        <button onclick="quickCommand('आज की तारीख क्या है')">
            📅 तारीख
        </button>

        <button onclick="quickCommand('यूट्यूब खोलो')">
            ▶️ YouTube
        </button>

        <button onclick="quickCommand('गूगल खोलो')">
            🔎 Google
        </button>

        <button onclick="quickCommand('तुम कौन हो')">
            🤖 GLITCH
        </button>

        <button onclick="stopAll()">
            🔇 Stop
        </button>

    </div>

    <div class="footer">
        GLITCH • VOICE AI SYSTEM
    </div>

</div>

<script>

/* =========================================================
   GLITCH AI
   SSML-STYLE VOICE SYSTEM
   ========================================================= */


/* ---------------------------------------------------------
   GLOBAL VARIABLES
   --------------------------------------------------------- */

let recognition = null;

let listening = false;

let voices = [];

let selectedVoice = null;

let speechQueue = [];

let speaking = false;


/* ---------------------------------------------------------
   ELEMENTS
   --------------------------------------------------------- */

const mic = document.getElementById("mic");
const orb = document.getElementById("orb");
const statusBox = document.getElementById("status");
const commandBox = document.getElementById("command");
const responseBox = document.getElementById("response");
const activityBox = document.getElementById("activity");


/* ---------------------------------------------------------
   LOAD VOICES
   --------------------------------------------------------- */

function loadVoices(){

    voices = speechSynthesis.getVoices();

    if(!voices.length){
        return;
    }

    /*
       Prefer Hindi voices.
       Then India voices.
       Then female-like names where available.
    */

    let hindiVoices = voices.filter(v =>
        v.lang &&
        (
            v.lang.toLowerCase() === "hi-in" ||
            v.lang.toLowerCase().startsWith("hi")
        )
    );

    if(hindiVoices.length){

        let femaleLike = hindiVoices.find(v => {

            let name = v.name.toLowerCase();

            return (
                name.includes("female") ||
                name.includes("woman") ||
                name.includes("google hindi") ||
                name.includes("neerja") ||
                name.includes("heera")
            );

        });

        selectedVoice = femaleLike || hindiVoices[0];

    }else{

        let indiaVoice = voices.find(v =>
            v.lang &&
            v.lang.toLowerCase().includes("in")
        );

        selectedVoice = indiaVoice || voices[0];
    }

}

speechSynthesis.onvoiceschanged = loadVoices;

loadVoices();


/* ---------------------------------------------------------
   SSML STYLE PARSER
   --------------------------------------------------------- */

/*
   Browser SpeechSynthesis doesn't directly understand
   <speak>, <break>, <say-as>, <sub> etc.

   Therefore we convert the SSML into speech commands.
*/


function parseSSML(ssml){

    let text = ssml;

    /*
       Remove <speak>
    */

    text = text.replace(/<speak>/gi, "");
    text = text.replace(/<\/speak>/gi, "");


    /*
       Paragraph
    */

    text = text.replace(/<p>/gi, "");
    text = text.replace(/<\/p>/gi, "\n");


    /*
       Sentences
    */

    text = text.replace(/<s>/gi, "");
    text = text.replace(/<\/s>/gi, ". ");


    /*
       BREAK

       Example:

       <break time="3s"/>
    */

    text = text.replace(
        /<break\s+time=["']([\d.]+)(ms|s)["']\s*\/?>/gi,
        function(match,time,unit){

            let ms =
                unit.toLowerCase() === "s"
                ? parseFloat(time) * 1000
                : parseFloat(time);

            return ` [[PAUSE:${ms}]] `;

        }
    );


    /*
       SAY-AS
    */

    text = text.replace(
        /<say-as\s+interpret-as=["']characters["']>(.*?)<\/say-as>/gi,
        function(match,value){

            return value
                .split("")
                .join(" ");

        }
    );


    /*
       Cardinal numbers
    */

    text = text.replace(
        /<say-as\s+interpret-as=["']cardinal["']>(.*?)<\/say-as>/gi,
        "$1"
    );


    /*
       Ordinal numbers
    */

    text = text.replace(
        /<say-as\s+interpret-as=["']ordinal["']>(.*?)<\/say-as>/gi,
        "$1"
    );


    /*
       SUB

       <sub alias="World Wide Web Consortium">W3C</sub>
    */

    text = text.replace(
        /<sub\s+alias=["'](.*?)["']>(.*?)<\/sub>/gi,
        "$1"
    );


    /*
       AUDIO

       Browser TTS cannot directly play SSML audio tags.

       We remove the tag and keep fallback text.
    */

    text = text.replace(
        /<audio\s+src=["'](.*?)["']>(.*?)<\/audio>/gi,
        "$2"
    );


    /*
       Remove remaining HTML tags
    */

    text = text.replace(/<[^>]+>/g, "");


    /*
       HTML entities
    */

    const textarea = document.createElement("textarea");

    textarea.innerHTML = text;

    text = textarea.value;


    return text.trim();
}


/* ---------------------------------------------------------
   SPEAK SSML
   --------------------------------------------------------- */

function speakSSML(ssml){

    stopSpeech();

    let parsed = parseSSML(ssml);

    /*
       Split pauses.
    */

    let parts = parsed.split(/(\[\[PAUSE:\d+(?:\.\d+)?\]\])/);

    speechQueue = [];

    for(let part of parts){

        if(!part.trim()){
            continue;
        }

        let pauseMatch =
            part.match(/\[\[PAUSE:(\d+(?:\.\d+)?)\]\]/);

        if(pauseMatch){

            speechQueue.push({
                type:"pause",
                time:parseFloat(pauseMatch[1])
            });

        }else{

            speechQueue.push({
                type:"speech",
                text:part.trim()
            });

        }

    }

    processSpeechQueue();
}


/* ---------------------------------------------------------
   SPEECH QUEUE
   --------------------------------------------------------- */

function processSpeechQueue(){

    if(!speechQueue.length){

        speaking = false;

        orb.classList.remove("listening");

        statusBox.textContent = "SYSTEM READY";

        return;
    }

    speaking = true;

    let item = speechQueue.shift();

    if(item.type === "pause"){

        setTimeout(
            processSpeechQueue,
            item.time
        );

        return;
    }


    let utterance =
        new SpeechSynthesisUtterance(item.text);


    /*
       Hindi
    */

    utterance.lang = "hi-IN";


    /*
       Selected device voice
    */

    if(selectedVoice){

        utterance.voice = selectedVoice;

    }


    /*
       Voice tuning
    */

    utterance.rate = 0.92;

    utterance.pitch = 1.08;

    utterance.volume = 1;


    utterance.onstart = function(){

        statusBox.textContent =
            "GLITCH SPEAKING";

        orb.classList.add("listening");

    };


    utterance.onend = function(){

        setTimeout(
            processSpeechQueue,
            80
        );

    };


    utterance.onerror = function(){

        setTimeout(
            processSpeechQueue,
            100
        );

    };


    speechSynthesis.speak(utterance);
}


/* ---------------------------------------------------------
   NORMAL SPEAK FUNCTION
   --------------------------------------------------------- */

function speak(text){

    /*
       Convert normal response into
       SSML-style speech.
    */

    let ssml =

    `<speak>
        <p>
            <s>${text}</s>
        </p>
    </speak>`;

    speakSSML(ssml);
}


/* ---------------------------------------------------------
   STOP SPEECH
   --------------------------------------------------------- */

function stopSpeech(){

    speechSynthesis.cancel();

    speechQueue = [];

    speaking = false;
}


/* ---------------------------------------------------------
   STOP EVERYTHING
   --------------------------------------------------------- */

function stopAll(){

    stopSpeech();

    if(recognition){

        try{
            recognition.stop();
        }catch(e){}

    }

    listening = false;

    mic.classList.remove("active");

    orb.classList.remove("listening");

    statusBox.textContent =
        "SYSTEM READY";

}


/* ---------------------------------------------------------
   SPEECH RECOGNITION
   --------------------------------------------------------- */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.lang = "hi-IN";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;


    recognition.onstart = function(){

        listening = true;

        mic.classList.add("active");

        orb.classList.add("listening");

        statusBox.textContent =
            "LISTENING...";

    };


    recognition.onresult = function(event){

        let text =
            event.results[0][0].transcript;

        commandBox.textContent =
            "आप: " + text;

        addActivity(text);

        processCommand(text);

    };


    recognition.onerror = function(event){

        statusBox.textContent =
            "MIC ERROR";

        listening = false;

        mic.classList.remove("active");

        orb.classList.remove("listening");

        console.log(event.error);

    };


    recognition.onend = function(){

        listening = false;

        mic.classList.remove("active");

        if(!speaking){

            orb.classList.remove("listening");

            statusBox.textContent =
                "SYSTEM READY";

        }

    };

}else{

    statusBox.textContent =
        "VOICE NOT SUPPORTED";

}


/* ---------------------------------------------------------
   MIC BUTTON
   --------------------------------------------------------- */

mic.addEventListener("click", function(){

    if(!recognition){

        speak(
            "आपके ब्राउज़र में voice recognition उपलब्ध नहीं है।"
        );

        return;
    }


    if(listening){

        try{
            recognition.stop();
        }catch(e){}

        return;
    }


    stopSpeech();


    try{

        recognition.start();

    }catch(error){

        console.log(error);

    }

});


/* ---------------------------------------------------------
   QUICK COMMAND
   --------------------------------------------------------- */

function quickCommand(text){

    commandBox.textContent =
        "आप: " + text;

    addActivity(text);

    processCommand(text);

}


/* ---------------------------------------------------------
   COMMAND ENGINE
   --------------------------------------------------------- */

function processCommand(command){

    let text =
        command.toLowerCase().trim();


    /*
       GREETING
    */

    if(
        text.includes("नमस्ते") ||
        text.includes("hello") ||
        text.includes("हेलो") ||
        text.includes("hi glitch")
    ){

        respond(
            "नमस्ते। मैं GLITCH हूँ। आप मुझे क्या करने का आदेश देना चाहते हैं?"
        );

        return;
    }


    /*
       TIME
    */

    if(
        text.includes("समय") ||
        text.includes("टाइम") ||
        text.includes("बजे")
    ){

        let now = new Date();

        let time =
            now.toLocaleTimeString(
                "hi-IN",
                {
                    hour:"numeric",
                    minute:"2-digit"
                }
            );

        respond(
            "अभी समय " + time + " है।"
        );

        return;
    }


    /*
       DATE
    */

    if(
        text.includes("तारीख") ||
        text.includes("डेट") ||
        text.includes("आज कौन सा दिन")
    ){

        let now = new Date();

        let date =
            now.toLocaleDateString(
                "hi-IN",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            );

        respond(
            "आज " + date + " है।"
        );

        return;
    }


    /*
       YOUTUBE
    */

    if(
        text.includes("youtube") ||
        text.includes("यूट्यूब")
    ){

        respond(
            "ठीक है। मैं YouTube खोल रही हूँ।"
        );

        setTimeout(function(){

            window.open(
                "https://www.youtube.com/",
                "_blank"
            );

        },1000);

        return;
    }


    /*
       GOOGLE
    */

    if(
        text.includes("google") ||
        text.includes("गूगल")
    ){

        respond(
            "ठीक है। मैं Google खोल रही हूँ।"
        );

        setTimeout(function(){

            window.open(
                "https://www.google.com/",
                "_blank"
            );

        },1000);

        return;
    }


    /*
       WHATSAPP
    */

    if(
        text.includes("whatsapp") ||
        text.includes("व्हाट्सएप")
    ){

        respond(
            "ठीक है। मैं WhatsApp खोलने की कोशिश कर रही हूँ।"
        );

        setTimeout(function(){

            window.open(
                "https://wa.me/",
                "_blank"
            );

        },1000);

        return;
    }


    /*
       WHO ARE YOU
    */

    if(
        text.includes("तुम कौन हो") ||
        text.includes("आप कौन हो") ||
        text.includes("तुम क्या हो")
    ){

        respond(
            "मैं GLITCH हूँ। मैं आपका personal AI voice assistant बनने के लिए बनाई गई हूँ।"
        );

        return;
    }


    /*
       STOP
    */

    if(
        text.includes("चुप") ||
        text.includes("बंद हो जाओ") ||
        text.includes("stop") ||
        text.includes("रुको")
    ){

        stopAll();

        return;
    }


    /*
       THANK YOU
    */

    if(
        text.includes("धन्यवाद") ||
        text.includes("thank you") ||
        text.includes("thanks")
    ){

        respond(
            "आपका स्वागत है।"
        );

        return;
    }


    /*
       UNKNOWN
    */

    respond(
        "मैंने आपका आदेश सुना, लेकिन इस web version में अभी उस काम के लिए Android permission उपलब्ध नहीं है।"
    );

}


/* ---------------------------------------------------------
   RESPONSE
   --------------------------------------------------------- */

function respond(text){

    responseBox.textContent =
        text;

    addActivity(
        "GLITCH: " + text
    );

    speak(text);
}


/* ---------------------------------------------------------
   ACTIVITY LOG
   --------------------------------------------------------- */

function addActivity(text){

    let line =
        document.createElement("div");

    line.textContent =
        "› " + text;

    activityBox.prepend(line);

    while(activityBox.children.length > 6){

        activityBox.removeChild(
            activityBox.lastChild
        );

    }

}


/* ---------------------------------------------------------
   TEST SSML
   --------------------------------------------------------- */

function testSSML(){

    let sample = `

    <speak>

        <p>

            <s>
                नमस्ते। मैं GLITCH हूँ।
            </s>

            <break time="700ms"/>

            <s>
                मैं आपकी voice assistant हूँ।
            </s>

            <break time="500ms"/>

            <s>
                आपका नंबर है
                <say-as interpret-as="cardinal">
                    10
                </say-as>
            </s>

        </p>

    </speak>

    `;

    speakSSML(sample);
}


/* ---------------------------------------------------------
   INITIAL MESSAGE
   --------------------------------------------------------- */

setTimeout(function(){

    speakSSML(`
        <speak>
            <p>
                <s>नमस्ते। मैं GLITCH हूँ।</s>
                <break time="500ms"/>
                <s>बताइए, मैं आपकी क्या मदद कर सकती हूँ?</s>
            </p>
        </speak>
    `);

},1000);

</script>

</body>
</html>
