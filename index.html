<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>GLITCH - AI Assistant</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050b;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    position:relative;
}

#particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
}

.app{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:15px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 15px;
    border:1px solid rgba(0,220,255,.35);
    background:rgba(3,12,24,.72);
    backdrop-filter:blur(12px);
    border-radius:18px;
    box-shadow:
        0 0 20px rgba(0,200,255,.12),
        inset 0 0 20px rgba(0,180,255,.04);
}

.logo{
    font-size:26px;
    font-weight:900;
    letter-spacing:5px;
    color:#7deaff;
    text-shadow:
        0 0 8px #00cfff,
        0 0 20px #008cff;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    color:#80ffb2;
    letter-spacing:1px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#36ff8b;
    box-shadow:0 0 12px #36ff8b;
}

/* MAIN */

.main{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

/* ORB */

.orb-area{
    position:relative;
    width:min(72vw,320px);
    height:min(72vw,320px);
    display:flex;
    justify-content:center;
    align-items:center;
}

.orb-ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(0,220,255,.45);
}

.r1{
    width:100%;
    height:100%;
    animation:rotate1 12s linear infinite;
}

.r2{
    width:82%;
    height:82%;
    border-color:rgba(120,70,255,.5);
    animation:rotate2 8s linear infinite reverse;
}

.r3{
    width:65%;
    height:65%;
    border-color:rgba(0,255,210,.6);
    animation:rotate1 5s linear infinite;
}

.r4{
    width:45%;
    height:45%;
    border:2px solid rgba(0,220,255,.7);
    box-shadow:
        0 0 20px rgba(0,210,255,.5),
        inset 0 0 20px rgba(0,210,255,.3);
    animation:pulse 2s ease-in-out infinite;
}

.orb-core{
    width:25%;
    height:25%;
    border-radius:50%;
    background:
        radial-gradient(circle,
        #ffffff 0%,
        #9af4ff 20%,
        #00bfff 45%,
        #006cff 70%,
        #00162c 100%);
    box-shadow:
        0 0 20px #00cfff,
        0 0 50px #008cff,
        0 0 90px rgba(0,180,255,.55);
    animation:corePulse 1.8s ease-in-out infinite;
}

.orb-label{
    position:absolute;
    bottom:3px;
    font-size:10px;
    letter-spacing:3px;
    color:#65dcff;
    opacity:.8;
}

@keyframes rotate1{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes rotate2{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}
}

@keyframes pulse{
    0%,100%{
        transform:scale(.92);
        opacity:.6;
    }
    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

@keyframes corePulse{
    0%,100%{transform:scale(.9)}
    50%{transform:scale(1.12)}
}

/* CHAT */

.chat-box{
    width:min(900px,100%);
    max-height:180px;
    overflow-y:auto;
    margin-top:10px;
    padding:10px;
    border-radius:15px;
    background:rgba(2,10,20,.72);
    border:1px solid rgba(0,210,255,.2);
    backdrop-filter:blur(10px);
}

.message{
    margin:6px 0;
    padding:9px 12px;
    border-radius:12px;
    font-size:14px;
    line-height:1.45;
}

.message.glitch{
    background:rgba(0,170,255,.09);
    border-left:3px solid #00cfff;
}

.message.user{
    background:rgba(150,70,255,.09);
    border-right:3px solid #9b5cff;
    text-align:right;
}

.message small{
    display:block;
    opacity:.5;
    font-size:9px;
    margin-bottom:3px;
}

/* INPUT */

.controls{
    width:min(900px,100%);
    margin-top:10px;
}

.input-row{
    display:flex;
    gap:8px;
}

#textInput{
    flex:1;
    min-width:0;
    padding:13px 15px;
    border-radius:14px;
    border:1px solid rgba(0,210,255,.35);
    outline:none;
    background:rgba(3,13,25,.88);
    color:white;
    font-size:14px;
}

#textInput:focus{
    border-color:#00d9ff;
    box-shadow:0 0 15px rgba(0,210,255,.15);
}

button{
    border:none;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

.send{
    width:54px;
    border-radius:14px;
    background:linear-gradient(135deg,#008cff,#00d9ff);
    box-shadow:0 0 15px rgba(0,200,255,.25);
}

.buttons{
    display:flex;
    gap:7px;
    margin-top:8px;
}

.control-btn{
    flex:1;
    padding:10px 5px;
    border-radius:12px;
    background:rgba(8,24,42,.9);
    border:1px solid rgba(0,200,255,.2);
    color:#aeefff;
    font-size:11px;
}

.control-btn:hover{
    background:rgba(0,120,180,.25);
}

.control-btn.active{
    border-color:#36ff9a;
    color:#36ff9a;
    box-shadow:0 0 12px rgba(50,255,150,.18);
}

/* QUICK COMMANDS */

.quick{
    width:min(900px,100%);
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:8px 0 2px;
}

.quick button{
    white-space:nowrap;
    padding:8px 11px;
    border-radius:20px;
    background:rgba(5,19,34,.8);
    border:1px solid rgba(0,200,255,.2);
    color:#8deaff;
    font-size:11px;
}

/* FOOTER */

.footer{
    text-align:center;
    padding-top:8px;
    font-size:9px;
    color:rgba(150,220,255,.45);
    letter-spacing:1px;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:3px;
}

::-webkit-scrollbar-thumb{
    background:#00bfff;
    border-radius:5px;
}

/* MOBILE */

@media(max-width:600px){

    .app{
        padding:9px;
    }

    .header{
        padding:10px 12px;
    }

    .logo{
        font-size:21px;
    }

    .orb-area{
        width:230px;
        height:230px;
    }

    .chat-box{
        max-height:145px;
    }

    .message{
        font-size:13px;
    }

    .control-btn{
        font-size:10px;
    }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="app">

    <header class="header">

        <div class="logo">
            GLITCH
        </div>

        <div class="status">
            <span class="status-dot"></span>
            ALL SYSTEMS ONLINE
        </div>

    </header>


    <main class="main">

        <div class="orb-area">

            <div class="orb-ring r1"></div>
            <div class="orb-ring r2"></div>
            <div class="orb-ring r3"></div>
            <div class="orb-ring r4"></div>

            <div class="orb-core"></div>

            <div class="orb-label">
                AI CORE
            </div>

        </div>


        <div id="chatBox" class="chat-box"></div>


        <div class="controls">

            <div class="input-row">

                <input
                    id="textInput"
                    type="text"
                    placeholder="GLITCH se kuchh puchhiye..."
                    autocomplete="off"
                >

                <button
                    class="send"
                    id="sendBtn">
                    ➤
                </button>

            </div>


            <div class="buttons">

                <button
                    class="control-btn"
                    id="listenBtn">
                    🎤 Start Listening
                </button>

                <button
                    class="control-btn"
                    id="stopBtn">
                    ⏹ Stop
                </button>

                <button
                    class="control-btn"
                    id="clearBtn">
                    🗑 Clear
                </button>

            </div>


            <div class="quick">

                <button data-command="YouTube kholo">
                    ▶ YouTube
                </button>

                <button data-command="Google kholo">
                    🔎 Google
                </button>

                <button data-command="WhatsApp kholo">
                    💬 WhatsApp
                </button>

                <button data-command="Instagram kholo">
                    📷 Instagram
                </button>

                <button data-command="Facebook kholo">
                    👥 Facebook
                </button>

                <button data-command="Gmail kholo">
                    ✉ Gmail
                </button>

                <button data-command="Maps kholo">
                    🗺 Maps
                </button>

                <button data-command="Telegram kholo">
                    ✈ Telegram
                </button>

                <button data-command="samay kya hua hai">
                    🕐 Time
                </button>

                <button data-command="tum kya kar sakte ho">
                    ❓ Help
                </button>

            </div>

        </div>

    </main>


    <div class="footer">
        GLITCH AI • VOICE • MEMORY • COMMAND SYSTEM
    </div>

</div>


<script>

/* =========================================================
   GLITCH CONFIGURATION
========================================================= */

const CONFIG = {

    name: "GLITCH",

    userName: "",

    language: "hi-IN",

    voiceId: "NOpBlnGInO9m6vDvFkFC",

    /*
       Agar ElevenLabs backend Render par deploy hai,
       to yahan apna Render URL daal sakte ho.

       Example:
       https://your-glitch-backend.onrender.com/api/tts

       Agar blank hai to browser voice use hogi.
    */

    ttsEndpoint: "",

    continuous: true,

    memoryKey: "GLITCH_MEMORY_V3"
};


/* =========================================================
   VARIABLES
========================================================= */

let recognition = null;

let listening = false;

let manuallyStopped = false;

let recognitionRunning = false;

let speaking = false;

let restartTimer = null;

let currentAudio = null;


/* =========================================================
   ELEMENTS
========================================================= */

const chatBox = document.getElementById("chatBox");

const textInput = document.getElementById("textInput");

const sendBtn = document.getElementById("sendBtn");

const listenBtn = document.getElementById("listenBtn");

const stopBtn = document.getElementById("stopBtn");

const clearBtn = document.getElementById("clearBtn");


/* =========================================================
   MEMORY
========================================================= */

function loadMemory(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(CONFIG.memoryKey)
            ) || {};

        CONFIG.userName = data.userName || "";

    }catch(error){

        CONFIG.userName = "";

    }

}


function saveMemory(){

    localStorage.setItem(
        CONFIG.memoryKey,
        JSON.stringify({
            userName: CONFIG.userName
        })
    );

}


loadMemory();


/* =========================================================
   CHAT
========================================================= */

function addMessage(type,text){

    const div = document.createElement("div");

    div.className =
        "message " +
        (type === "user" ? "user" : "glitch");

    const title =
        type === "user" ? "YOU" : "GLITCH";

    div.innerHTML =
        "<small>" +
        title +
        "</small>" +
        escapeHTML(text);

    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;

}


function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   IMPORTANT:
   BOSS KO HAR SENTENCE MEIN NAHI LAGANA
========================================================= */

function boss(text){

    text = String(text || "").trim();

    if(!text){

        return "मैं यहाँ हूँ।";

    }

    /*
       Yahan Boss automatically add nahi hoga.
       Isliye har sentence ke end mein Boss nahi aayega.
    */

    return text;

}


/* =========================================================
   SPEECH OUTPUT
========================================================= */

async function speak(text){

    text = boss(text);

    speaking = true;

    stopRecognitionForSpeech();


    /*
       ELEVENLABS BACKEND
    */

    if(CONFIG.ttsEndpoint){

        try{

            if(currentAudio){

                currentAudio.pause();

                currentAudio = null;

            }


            const response =
                await fetch(
                    CONFIG.ttsEndpoint,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            text:text,

                            voiceId:
                                CONFIG.voiceId

                        })
                    }
                );


            if(response.ok){

                const blob =
                    await response.blob();

                const url =
                    URL.createObjectURL(blob);

                currentAudio =
                    new Audio(url);


                currentAudio.onended =
                    function(){

                        URL.revokeObjectURL(url);

                        speaking = false;

                        resumeListening();

                    };


                currentAudio.onerror =
                    function(){

                        speaking = false;

                        resumeListening();

                    };


                await currentAudio.play();

                return;

            }

        }catch(error){

            console.log(
                "ElevenLabs unavailable:",
                error
            );

        }

    }


    /*
       BROWSER VOICE FALLBACK
    */

    if("speechSynthesis" in window){

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang =
            CONFIG.language;

        utterance.rate = 0.95;

        utterance.pitch = 1.0;

        utterance.volume = 1.0;


        const voices =
            window.speechSynthesis
                .getVoices();


        const hindiVoice =
            voices.find(v =>
                v.lang &&
                v.lang.toLowerCase()
                    .startsWith("hi")
            );


        if(hindiVoice){

            utterance.voice =
                hindiVoice;

        }


        utterance.onend =
            function(){

                speaking = false;

                resumeListening();

            };


        utterance.onerror =
            function(){

                speaking = false;

                resumeListening();

            };


        window.speechSynthesis
            .speak(utterance);

    }else{

        speaking = false;

        resumeListening();

    }

}


/* =========================================================
   STOP SPEECH
========================================================= */

function stopSpeech(){

    if("speechSynthesis" in window){

        window.speechSynthesis.cancel();

    }


    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }

    speaking = false;

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function setupRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        addMessage(
            "glitch",
            "इस browser में voice recognition उपलब्ध नहीं है। Text box का इस्तेमाल कर सकते हैं।"
        );

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        CONFIG.language;


    recognition.interimResults = false;

    recognition.continuous = false;

    recognition.maxAlternatives = 1;


    recognition.onstart =
        function(){

            recognitionRunning = true;

            listenBtn.classList.add("active");

            listenBtn.textContent =
                "🎤 Listening...";

        };


    recognition.onresult =
        function(event){

            const transcript =
                event.results[
                    event.results.length - 1
                ][0].transcript.trim();


            if(!transcript){

                return;

            }


            addMessage(
                "user",
                transcript
            );


            processCommand(transcript);

        };


    recognition.onerror =
        function(event){

            recognitionRunning = false;

            console.log(
                "Speech error:",
                event.error
            );


            /*
               no-speech / aborted ko ignore karna
            */

            if(
                event.error !== "no-speech" &&
                event.error !== "aborted"
            ){

                addMessage(
                    "glitch",
                    "Voice recognition mein problem aa gayi. Aap dobara try kar sakte hain."
                );

            }

        };


    recognition.onend =
        function(){

            recognitionRunning = false;

            listenBtn.textContent =
                listening
                ? "🎤 Listening..."
                : "🎤 Start Listening";


            if(
                listening &&
                CONFIG.continuous &&
                !manuallyStopped &&
                !speaking
            ){

                scheduleRecognition();

            }

        };

}


/* =========================================================
   START LISTENING
========================================================= */

function startListening(){

    if(!recognition){

        setupRecognition();

    }


    if(!recognition){

        return;

    }


    manuallyStopped = false;

    listening = true;


    scheduleRecognition();

}


/* =========================================================
   SCHEDULE RECOGNITION
========================================================= */

function scheduleRecognition(){

    clearTimeout(restartTimer);


    restartTimer =
        setTimeout(
            function(){

                if(
                    !listening ||
                    manuallyStopped ||
                    speaking ||
                    recognitionRunning
                ){

                    return;

                }


                try{

                    recognition.start();

                }catch(error){

                    console.log(
                        "Recognition start:",
                        error
                    );

                }

            },
            500
        );

}


/* =========================================================
   STOP RECOGNITION FOR SPEECH
========================================================= */

function stopRecognitionForSpeech(){

    if(recognition && recognitionRunning){

        try{

            recognition.stop();

        }catch(error){}

    }

}


/* =========================================================
   RESUME AFTER SPEECH
========================================================= */

function resumeListening(){

    if(
        listening &&
        CONFIG.continuous &&
        !manuallyStopped
    ){

        scheduleRecognition();

    }

}


/* =========================================================
   STOP LISTENING
========================================================= */

function stopListening(){

    manuallyStopped = true;

    listening = false;

    clearTimeout(restartTimer);


    if(recognition){

        try{

            recognition.stop();

        }catch(error){}

    }


    recognitionRunning = false;

    listenBtn.classList.remove("active");

    listenBtn.textContent =
        "🎤 Start Listening";

}


/* =========================================================
   COMMAND NORMALIZATION
========================================================= */

function normalize(text){

    return String(text)
        .toLowerCase()
        .trim()
        .replace(/[!?.,]/g,"")
        .replace(/\s+/g," ");

}


/* =========================================================
   APP OPENING
========================================================= */

function openURL(url){

    try{

        window.location.href = url;

    }catch(error){

        window.open(url,"_blank");

    }

}


function launchApp(app){

    const urls = {

        youtube:
            "https://www.youtube.com/",

        google:
            "https://www.google.com/",

        whatsapp:
            "https://web.whatsapp.com/",

        instagram:
            "https://www.instagram.com/",

        facebook:
            "https://www.facebook.com/",

        gmail:
            "https://mail.google.com/",

        maps:
            "https://maps.google.com/",

        telegram:
            "https://web.telegram.org/"

    };


    if(urls[app]){

        openURL(urls[app]);

    }

}


/* =========================================================
   TIME
========================================================= */

function getTime(){

    const now = new Date();

    return now.toLocaleTimeString(
        "hi-IN",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   DATE
========================================================= */

function getDate(){

    const now = new Date();

    return now.toLocaleDateString(
        "hi-IN",
        {
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}


/* =========================================================
   HELP
========================================================= */

function helpText(){

    return `
मैं voice और text दोनों से आपकी मदद कर सकता हूँ।

आप मुझसे time और date पूछ सकते हैं।

आप कह सकते हैं:
YouTube खोलो,
Google खोलो,
WhatsApp खोलो,
Instagram खोलो,
Facebook खोलो,
Gmail खोलो,
Telegram खोलो,
या Maps खोलो।

आप पूछ सकते हैं कि मैं क्या कर सकता हूँ।

आप मुझसे सामान्य सवाल भी पूछ सकते हैं।
`;

}


/* =========================================================
   COMMAND PROCESSOR
========================================================= */

async function processCommand(rawText){

    const original =
        String(rawText || "").trim();

    if(!original){

        return;

    }


    const text =
        normalize(original);


    /*
       NAME
    */

    if(
        text.includes("mera naam") &&
        (
            text.includes("hai") ||
            text.includes("kya")
        )
    ){

        if(CONFIG.userName){

            const reply =
                "आपका नाम " +
                CONFIG.userName +
                " है।";

            addMessage("glitch",reply);

            speak(reply);

        }else{

            const reply =
                "अभी आपने मुझे अपना नाम नहीं बताया है।";

            addMessage("glitch",reply);

            speak(reply);

        }

        return;

    }


    /*
       NAME SAVE
    */

    if(
        text.startsWith("mera naam ")
    ){

        let name =
            original
                .substring(
                    original.toLowerCase()
                        .indexOf("mera naam ") +
                    10
                )
                .trim();


        if(name){

            CONFIG.userName = name;

            saveMemory();


            const reply =
                "ठीक है, मैं याद रखूँगा कि आपका नाम " +
                name +
                " है।";

            addMessage("glitch",reply);

            speak(reply);

            return;

        }

    }


    /*
       GREETING
    */

    if(
        text === "hello" ||
        text === "hi" ||
        text === "hey" ||
        text.includes("namaste") ||
        text.includes("namaskar")
    ){

        const reply =
            CONFIG.userName
            ? "नमस्ते " + CONFIG.userName + "। मैं यहाँ हूँ।"
            : "नमस्ते। मैं यहाँ हूँ। बताइए, क्या करना है।";

        addMessage("glitch",reply);

        speak(reply);

        return;

    }


    /*
       HOW ARE YOU
    */

    if(
        text.includes("kaise ho") ||
        text.includes("kesi ho") ||
        text.includes("how are you")

/* =========================================================
   PARTICLE BACKGROUND
========================================================= */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");


let particles = [];

let width = 0;

let height = 0;


function resizeCanvas(){

    width =
        canvas.width =
        window.innerWidth *
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    height =
        canvas.height =
        window.innerHeight *
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";


    particles = [];


    const count =
        Math.min(
            100,
            Math.floor(
                window.innerWidth *
                window.innerHeight /
                10000
            )
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        particles.push({

            x:Math.random()*width,

            y:Math.random()*height,

            r:
                Math.random()*1.8+.4,

            vx:
                (Math.random()-.5)*.3,

            vy:
                (Math.random()-.5)*.3,

            a:
                Math.random()*.6+.2

        });

    }

}


function drawParticles(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    for(
        const p of particles
    ){

        p.x += p.vx;

        p.y += p.vy;


        if(p.x < 0) p.x = width;

        if(p.x > width) p.x = 0;

        if(p.y < 0) p.y = height;

        if(p.y > height) p.y = 0;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            "rgba(0,210,255," +
            p.a +
            ")";


        ctx.fill();

    }


    requestAnimationFrame(
        drawParticles
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();

drawParticles();
